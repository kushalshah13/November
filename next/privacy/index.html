<style>
:root { --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1A1414; --muted:#5C5352; --line:#E3E1DD; --soft:#F3F3F1;

@media not all { :root:not([data-theme="light"]) { --bg:#1A1414; --surface:#1A1414; --ink:#FFFFFF; --muted:#F3F3F1; --line:#E3E1DD; --soft:#F3F3F1; color-scheme: dark; } }
:root[data-theme="never"] { --bg:#1A1414; --surface:#1A1414; --ink:#FFFFFF; --muted:#F3F3F1; --line:#E3E1DD; --soft:#F3F3F1; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--body); }
header { border-bottom: 1px solid var(--line); }
.in { max-width: 680px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; }
.mark { font: 700 2rem/1 var(--display); letter-spacing: -0.02em; color: var(--ink); text-decoration: none; font-stretch: 88%; }
.mark i { display: inline-block; width: 0.17em; height: 0.17em; margin-left: 0.05em; background: #D4A537; border-radius: 50%; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 3px; background: var(--surface); }
.lang button { font: 500 0.875rem var(--body); border: 0; background: none; color: var(--ink); min-width: 40px; min-height: 36px; border-radius: 6px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
main { padding: 36px 0 64px; }
h1 { font: 700 clamp(2rem, 7vw, 2.8rem)/1.1 var(--display); letter-spacing: -0.02em; margin: 0 0 12px; font-stretch: 88%; }
.lede { color: var(--muted); font-size: 1.0625rem; margin: 0 0 28px; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; margin-bottom: 14px; }
h2 { font: 700 1.3rem/1.25 var(--display); margin: 0 0 8px; font-stretch: 88%; }
ul { margin: 0; padding-left: 20px; } li + li { margin-top: 6px; }
p { margin: 0; } p + p { margin-top: 8px; }
.opt { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.btn { font: 600 1rem var(--body); padding: 12px 20px; min-height: 48px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }
.btn.off { background: transparent; color: var(--ink); }
.status { color: var(--muted); font-size: 0.9375rem; }
.back { display: inline-block; margin-top: 18px; color: var(--ink); font-weight: 600; text-underline-offset: 4px; }
.fine { color: var(--muted); font-size: 0.875rem; margin-top: 20px; }
</style>

}
